<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      user-select: none;
    }

    #card {
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 20, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2), inset 0 0 15px rgba(0, 255, 200, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 200, 0.3);
    }

    #header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(0, 255, 200, 0.2);
      background: linear-gradient(90deg, rgba(0,255,200,0.1) 0%, transparent 100%);
    }

    #title {
      font-size: 14px;
      font-weight: bold;
      color: #00FFD1;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 255, 200, 0.5);
      text-transform: uppercase;
    }

    #close {
      -webkit-app-region: no-drag;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: rgba(255, 50, 50, 0.1);
      border: 1px solid rgba(255, 50, 50, 0.3);
      color: #ff4444;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #close:hover {
      background: rgba(255, 50, 50, 0.3);
      box-shadow: 0 0 10px rgba(255, 50, 50, 0.4);
      color: white;
    }

    #body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: text;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      color: #E0E0E0;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(0, 255, 200, 0.15);
      border: 1px solid rgba(0, 255, 200, 0.4);
      border-bottom-right-radius: 0;
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.1);
    }

    .msg.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 0;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: rgba(0, 255, 200, 0.5);
      font-size: 12px;
      padding: 4px 8px;
    }

    .typing {
      align-self: flex-start;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      border-bottom-left-radius: 0;
      display: flex;
      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #00FFD1;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      box-shadow: 0 0 5px #00FFD1;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    #footer {
      padding: 12px;
      display: flex;
      gap: 10px;
      border-top: 1px solid rgba(0, 255, 200, 0.2);
      background: rgba(0,0,0,0.2);
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      color: #00FFD1;
      background: rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    #input::placeholder {
      color: rgba(0, 255, 200, 0.3);
    }

    #input:focus {
      border-color: #00FFD1;
      box-shadow: 0 0 10px rgba(0, 255, 200, 0.2);
    }

    #send {
      padding: 0 20px;
      background: rgba(0, 255, 200, 0.15);
      color: #00FFD1;
      border: 1px solid rgba(0, 255, 200, 0.5);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    #send:hover:not(:disabled) {
      background: rgba(0, 255, 200, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
    }

    #send:active:not(:disabled) { transform: scale(0.96); }
    #send:disabled { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,255,255,0.2); color: #888; background: transparent; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 200, 0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 200, 0.4); }
  </style>
</head>
<body>
  <div id="card">
    <div id="header">
      <span id="title">OpenPet</span>
      <button id="close" title="关闭">×</button>
    </div>
    <div id="body"></div>
    <div id="footer">
      <input type="text" id="input" placeholder="说点什么..." autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
  <script src="chat-renderer.js"></script>
</body>
</html>
