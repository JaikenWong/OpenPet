<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>OpenPet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    #pet {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: auto;
      cursor: grab;
      -webkit-user-drag: none;
    }

    #pet:active {
      cursor: grabbing;
    }

    #radial-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 100;
    }
    #radial-menu::before {
      content: '';
      position: absolute;
      top: -80px; left: -80px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #radial-menu.active::before {
      opacity: 1;
    }
    #radial-menu.active {
      pointer-events: auto;
    }
    .radial-item {
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .radial-btn {
      position: absolute;
      top: -26px;
      left: -26px;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(15, 20, 25, 0.88);
      border: 1px solid rgba(0, 255, 200, 0.5);
      box-shadow: 0 0 12px rgba(0, 255, 200, 0.25), inset 0 0 10px rgba(0, 255, 200, 0.12);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      padding: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #00FFD1;
      text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s, color 0.2s, box-shadow 0.2s, border-color 0.2s;
      opacity: 0;
      transform: translate(0, 0) scale(0);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #radial-menu.active .radial-btn {
      opacity: 1;
      transform: translate(var(--tx), var(--ty)) scale(1);
    }
    .radial-btn:hover {
      background: rgba(0, 255, 200, 0.24);
      border-color: rgba(0, 255, 200, 0.75);
      box-shadow: 0 0 18px rgba(0, 255, 200, 0.65), inset 0 0 14px rgba(0, 255, 200, 0.42);
      color: #FFF;
    }
    .radial-btn:active {
      transform: translate(var(--tx), var(--ty)) scale(0.92);
    }
  </style>
</head>
<body>
  <canvas id="pet" width="240" height="240"></canvas>
  <div id="radial-menu"></div>
  <script src="renderer.js"></script>
</body>
</html>
